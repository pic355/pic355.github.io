<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official developer website for VoidGlass, an Android image discovery and downloading tool.">
  <title>VoidGlass — Official Developer Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #0d0d12;
      color: #f4f4f6;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(42px, 8vw, 72px);
      letter-spacing: -2px;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 560px;
      color: #b8b8c2;
      font-size: 18px;
      line-height: 1.6;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      border: 1px solid #34343e;
      border-radius: 10px;
      color: #f4f4f6;
      text-decoration: none;
      transition: 0.2s ease;
    }

    a:hover {
      background: #1b1b23;
      border-color: #555563;
    }

    footer {
      margin-top: 48px;
      color: #777781;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <h1>VoidGlass</h1>

    <p class="subtitle">
      A privacy-focused Android browser for discovering, viewing,
      and downloading images from the web.
    </p>

    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.imagegrabber.app">
        View on Google Play
      </a>

      <a href="https://pic355.github.io/VoidGlass-Privacy-Policy/">
        Privacy Policy
      </a>
    </div>

    <footer>
      Official VoidGlass developer website
    </footer>
  </main>
</body>
</html>
